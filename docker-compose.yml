# Questalina Desk. Only Caddy publishes ports, and only on XPM_BIND_ADDR.
# PostgreSQL, the server, and the worker are reachable solely on Docker networks.
name: ${COMPOSE_PROJECT_NAME:-xpm}

x-app: &app
  image: xpm-app:${XPM_IMAGE_TAG:-local}
  build: .
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true

x-db-env: &db-env
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: xpm
  TZ: UTC
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: xpm
      POSTGRES_USER: xpm_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_owner_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [pg_owner_password]
    volumes:
      - ${XPM_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    shm_size: 256mb
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xpm_owner -d xpm"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: ["node", "packages/core/dist/migrate-cli.js"]
    environment:
      <<: *db-env
      PGUSER: xpm_owner
      PGPASSWORD_FILE: /run/secrets/pg_owner_password
      XPM_WEB_DB_PASSWORD_FILE: /run/secrets/pg_web_password
      XPM_WORKER_DB_PASSWORD_FILE: /run/secrets/pg_worker_password
      XPM_VAULT_DB_PASSWORD_FILE: /run/secrets/pg_vault_password
      XPM_GATEWAY_DB_PASSWORD_FILE: /run/secrets/pg_gateway_password
      XPM_PM_TOOLS_DB_PASSWORD_FILE: /run/secrets/pg_pm_tools_password
      XPM_DEV_TOOLS_DB_PASSWORD_FILE: /run/secrets/pg_dev_tools_password
    secrets: [pg_owner_password, pg_web_password, pg_worker_password, pg_vault_password, pg_gateway_password, pg_pm_tools_password, pg_dev_tools_password]
    networks: [internal]
    depends_on:
      postgres: { condition: service_healthy }

  server:
    <<: *app
    command: ["node", "apps/server/dist/main.js"]
    environment:
      <<: *db-env
      PGUSER: xpm_web
      PGPASSWORD_FILE: /run/secrets/pg_web_password
      XPM_PUBLIC_ORIGIN: ${XPM_PUBLIC_ORIGIN:?set XPM_PUBLIC_ORIGIN in .env}
      XPM_SAMPLE_DATA: ${XPM_SAMPLE_DATA:-false}
      XPM_SESSION_TTL_HOURS: ${XPM_SESSION_TTL_HOURS:-12}
      XPM_SESSION_IDLE_MINUTES: ${XPM_SESSION_IDLE_MINUTES:-60}
      XPM_INTAKE_URL: http://intake:4200
      XPM_INTAKE_SUBMIT_TOKEN_FILE: /run/secrets/intake_submit_token
    secrets: [pg_web_password, intake_submit_token]
    networks: [internal, edge]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *app
    command: ["node", "apps/worker/dist/main.js"]
    environment:
      <<: *db-env
      PGUSER: xpm_worker
      PGPASSWORD_FILE: /run/secrets/pg_worker_password
      XPM_SAMPLE_DATA: ${XPM_SAMPLE_DATA:-false}
      XPM_WORKER_NAME: worker
      XPM_JOB_LEASE_MS: ${XPM_JOB_LEASE_MS:-30000}
    secrets: [pg_worker_password]
    networks: [internal]
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Tool gateway: the agents' only door. Authorizes every tool call by role,
  # gates payloads for unredacted data, and writes traces. Holds three narrow
  # DB roles and the read-only snapshot; no vault, no mail, no send capability.
  gateway:
    <<: *app
    command: ["node", "apps/gateway/dist/main.js"]
    environment:
      <<: *db-env
      PGUSER: xpm_gateway
      XPM_GATEWAY_DB_PASSWORD_FILE: /run/secrets/pg_gateway_password
      PGPASSWORD_FILE: /run/secrets/pg_gateway_password
      XPM_PM_TOOLS_DB_PASSWORD_FILE: /run/secrets/pg_pm_tools_password
      XPM_DEV_TOOLS_DB_PASSWORD_FILE: /run/secrets/pg_dev_tools_password
      XPM_PM_RUNTIME_TOKEN_FILE: /run/secrets/pm_runtime_token
      XPM_DEV_RUNTIME_TOKEN_FILE: /run/secrets/dev_runtime_token
      XPM_SNAPSHOT_DIR: /snapshots/current
      XPM_AI_PROVIDER: simulated
    secrets: [pg_gateway_password, pg_pm_tools_password, pg_dev_tools_password, pm_runtime_token, dev_runtime_token]
    volumes:
      - source_snapshots:/snapshots:ro
    networks: [internal, agents_pm, agents_dev]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Agent runtimes: empty, read-only containers. Their only route is to the
  # gateway, on a network shared with nothing else. No database, no files,
  # no internet, no sending capability.
  pm-runtime:
    <<: *app
    command: ["node", "apps/agent-runtime/dist/main.js"]
    environment:
      AGENT_ROLE: pm
      XPM_GATEWAY_URL: http://gateway:4100
      XPM_RUNTIME_TOKEN_FILE: /run/secrets/pm_runtime_token
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets: [pm_runtime_token]
    networks: [agents_pm]
    depends_on:
      gateway: { condition: service_healthy }

  dev-runtime:
    <<: *app
    command: ["node", "apps/agent-runtime/dist/main.js"]
    environment:
      AGENT_ROLE: dev
      XPM_GATEWAY_URL: http://gateway:4100
      XPM_RUNTIME_TOKEN_FILE: /run/secrets/dev_runtime_token
      LOG_LEVEL: ${LOG_LEVEL:-info}
    secrets: [dev_runtime_token]
    networks: [agents_dev]
    depends_on:
      gateway: { condition: service_healthy }

  # Intake: the only service with the master key, the vault role, and the
  # Gmail read-only authorization. Polls Gmail and accepts manual SMS from the
  # dashboard server. Its egress network is used only for Google; the client
  # refuses any other host and any non-GET Gmail request.
  intake:
    <<: *app
    entrypoint: ["node", "apps/intake/dist/cli.js"]
    command: ["serve"]
    environment:
      <<: *db-env
      PGUSER: xpm_vault
      PGPASSWORD_FILE: /run/secrets/pg_vault_password
      XPM_MASTER_KEY_FILE: /run/secrets/protected_master_key
      XPM_GMAIL_CLIENT_FILE: /run/secrets/gmail_reader_client
      XPM_INTAKE_SUBMIT_TOKEN_FILE: /run/secrets/intake_submit_token
      XPM_CUSTOMER_ADDRESSES: ${XPM_CUSTOMER_ADDRESSES:-}
      XPM_GMAIL_POLL_SECONDS: ${XPM_GMAIL_POLL_SECONDS:-60}
      XPM_SAMPLE_DATA: ${XPM_SAMPLE_DATA:-false}
    secrets: [pg_vault_password, protected_master_key, gmail_reader_client, intake_submit_token]
    networks: [internal, google_egress]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Source snapshot tool (Milestone 5 adds GitHub sync). No database, no network.
  reposync:
    <<: *app
    profiles: [tools]
    restart: "no"
    entrypoint: ["node", "packages/privacy/dist/snapshot-cli.js"]
    command: ["help"]
    network_mode: none
    environment:
      XPM_SAMPLE_DATA: ${XPM_SAMPLE_DATA:-false}
      XPM_SNAPSHOT_ROOT: /snapshots
    volumes:
      - source_snapshots:/snapshots

  # Master key tool (interactive, on demand): docker compose run --rm keytool <command>
  keytool:
    <<: *app
    profiles: [tools]
    restart: "no"
    entrypoint: ["node", "packages/core/dist/key-cli.js"]
    command: ["help"]
    network_mode: none
    environment:
      XPM_MASTER_KEY_FILE: /secrets/protected_master_key
    volumes:
      - ${XPM_SECRETS_DIR:-./secrets}:/secrets

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      XPM_HOST: ${XPM_HOST:?set XPM_HOST in .env}
    ports:
      - "${XPM_BIND_ADDR:?set XPM_BIND_ADDR in .env}:${XPM_HTTPS_PORT:-443}:443"
      - "${XPM_BIND_ADDR}:${XPM_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${XPM_DATA_DIR:-./data}/caddy:/data
    networks: [edge]
    depends_on:
      server: { condition: service_healthy }

networks:
  # No route to the outside world: database and worker traffic stays here.
  internal:
    internal: true
  # One network per agent runtime, shared only with the gateway.
  agents_pm:
    internal: true
  agents_dev:
    internal: true
  # Outbound internet for the intake service only (Google APIs).
  google_egress: {}
  edge: {}

volumes:
  source_snapshots: {}

secrets:
  pg_owner_password:
    file: ${XPM_SECRETS_DIR:-./secrets}/pg_owner_password
  pg_web_password:
    file: ${XPM_SECRETS_DIR:-./secrets}/pg_web_password
  pg_worker_password:
    file: ${XPM_SECRETS_DIR:-./secrets}/pg_worker_password
  pg_vault_password:
    file: ${XPM_SECRETS_DIR:-./secrets}/pg_vault_password
  pg_gateway_password:
    file: ${XPM_SECRETS_DIR:-./secrets}/pg_gateway_password
  pg_pm_tools_password:
    file: ${XPM_SECRETS_DIR:-./secrets}/pg_pm_tools_password
  pg_dev_tools_password:
    file: ${XPM_SECRETS_DIR:-./secrets}/pg_dev_tools_password
  pm_runtime_token:
    file: ${XPM_SECRETS_DIR:-./secrets}/pm_runtime_token
  dev_runtime_token:
    file: ${XPM_SECRETS_DIR:-./secrets}/dev_runtime_token
  protected_master_key:
    file: ${XPM_SECRETS_DIR:-./secrets}/protected_master_key
  gmail_reader_client:
    file: ${XPM_SECRETS_DIR:-./secrets}/gmail_reader_client.json
  intake_submit_token:
    file: ${XPM_SECRETS_DIR:-./secrets}/intake_submit_token
